services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genz_english}
      POSTGRES_USER: ${POSTGRES_USER:-genz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Luna's voice (tts/server.py), used when TTS_PROVIDER=kokoro. The first start downloads the model (~350 MB).
  tts:
    build: ./tts
    restart: unless-stopped
    ports:
      - "${TTS_PORT:-8090}:8090"
    volumes:
      - tts-data:/data

volumes:
  postgres-data:
  tts-data:
